name: Backup de base de datos

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Generar dump de la base de datos
        run: |
          FECHA=$(date +%Y-%m-%d)
          echo "FECHA=$FECHA" >> "$GITHUB_ENV"
          pg_dump "${{ secrets.DATABASE_URL }}" --format=custom --file="backup-$FECHA.dump"
        env:
          PGSSLMODE: require

      - name: Subir copia como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.FECHA }}
          path: backup-${{ env.FECHA }}.dump
          retention-days: 30
